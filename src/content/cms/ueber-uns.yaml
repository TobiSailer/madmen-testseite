heroTitle: Ein Familienbetrieb aus Wolfratshausen
heroText: >-
  Die Schreinerei Huber wurde 1987 gegründet und wird heute in zweiter
  Generation von Michael Huber geführt.
sections:
  - heading: Von der kleinen Werkstatt zum Meisterbetrieb
    text: >-
      Angefangen hat alles mit einer Hobelbank in einer Garage. Heute arbeiten
      wir in einer eigenen Werkstatt mit moderner CNC-Technik und klassischen
      Maschinen. Die meisten Arbeitsschritte machen wir aber nach wie vor von
      Hand.


      Unsere Kundinnen und Kunden kommen überwiegend aus dem Landkreis Bad
      Tölz-Wolfratshausen und dem Raum Starnberg. Viele davon kennen uns über
      Empfehlungen, und viele kommen nach einigen Jahren mit dem nächsten
      Projekt wieder.
  - heading: Wie wir arbeiten
    text: >-
      Bevor wir etwas bauen, schauen wir uns den Raum an und hören zu. Daraus
      entsteht ein Entwurf, den wir mit Ihnen so lange abstimmen, bis er passt.
      Erst dann geht es in die Werkstatt.
facts:
  - value: '1987'
    label: gegründet in Wolfratshausen
  - value: '8'
    label: Mitarbeitende in Werkstatt und Montage
  - value: '2'
    label: Auszubildende pro Jahrgang
valuesTitle: Drei Dinge, die uns wichtig sind
values:
  - title: Holz aus der Region
    text: >-
      Wo es möglich ist, verarbeiten wir Eiche, Buche und Fichte aus bayerischen
      Wäldern und kaufen bei Sägewerken in der Umgebung.
  - title: Klare Angebote
    text: >-
      Sie bekommen ein Angebot, in dem jede Position nachvollziehbar ist. Ändert
      sich etwas, sprechen wir vorher mit Ihnen.
  - title: Ausbildung im Betrieb
    text: >-
      Wir bilden jedes Jahr Schreinerinnen und Schreiner aus, weil wir gutes
      Handwerk auch in Zukunft in der Region halten wollen.
